services:
  redis:
    image: redis:7-alpine
    container_name: kytapay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kytapay-api-v2
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      # Override REDIS_ADDR untuk menggunakan service name di Docker network
      - REDIS_ADDR=redis:6379
    volumes:
      # Mount .env file untuk godotenv (working directory di container adalah /root/)
      - ./.env:/root/.env:ro
      # Mount RSA private key jika diperlukan
      - ./pkcs8_rsa_private_key.pem:/root/pkcs8_rsa_private_key.pem:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  redis-data:

