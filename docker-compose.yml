version: '3.8'

services:
  api-v2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kytapay-api-v2
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    volumes:
      # Mount RSA private key jika diperlukan
      - ./pkcs8_rsa_private_key.pem:/root/pkcs8_rsa_private_key.pem:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

